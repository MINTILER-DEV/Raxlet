name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: raxlet
          POSTGRES_PASSWORD: integration-only
          POSTGRES_DB: raxlet_test
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --include=dev
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run test:integration
        env:
          TEST_DATABASE_URL: postgres://raxlet:integration-only@localhost:5432/raxlet_test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run db:migrate
        env:
          DATABASE_URL: postgres://raxlet:integration-only@localhost:5432/raxlet_test
      - run: npm run test:browser
        env:
          DATABASE_URL: postgres://raxlet:integration-only@localhost:5432/raxlet_test
          BETTER_AUTH_URL: http://localhost:3000
          BETTER_AUTH_SECRET: ci-only-browser-test-secret-not-for-production-123456
